name: repo-into-notes-pdf
on:
  push:
    paths: ["skills/repo-into-notes-pdf/**", ".github/workflows/repo-into-notes-pdf.yml"]
  pull_request:
    paths: ["skills/repo-into-notes-pdf/**", ".github/workflows/repo-into-notes-pdf.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/repo-into-notes-pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils
      - name: build the template guide
        run: |
          python scripts/build.py assets/template --out /tmp/t.pdf | tee /tmp/build.log
          ! grep -q "no page found" /tmp/build.log
          python scripts/check.py /tmp/t.pdf
      - name: scan a repo
        run: python scripts/scan_repo.py https://github.com/firass99/express-intern-management --out /tmp/work
