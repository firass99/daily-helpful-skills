name: repo-into-notes-pdf
on:
  push:
    paths: ["skills/repo-into-notes-pdf/**", ".github/workflows/repo-into-notes-pdf.yml"]
  pull_request:
    paths: ["skills/repo-into-notes-pdf/**", ".github/workflows/repo-into-notes-pdf.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/repo-into-notes-pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # no npm step on purpose: the scripts must install their own packages on first run
      - name: build the template guide (uses the runner's preinstalled Chrome)
        run: |
          node scripts/build.mjs assets/template --out /tmp/t.pdf | tee /tmp/build.log
          ! grep -q "no page found" /tmp/build.log
          node scripts/check.mjs /tmp/t.pdf
          test -s /tmp/t-contact.png
      - name: scan a repo
        run: node scripts/scan.mjs https://github.com/firass99/express-intern-management --out /tmp/work
